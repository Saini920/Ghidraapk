name: Push-triggered Auto Release via GitHub Releases

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore persistent debug.keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build APK Binary
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Direct Upload & Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Ghidra Mobile APK Release v1.0.${{ github.run_number }}"
          body: |
            🚀 **Push-Triggered Auto Release (Artifact-Free Direct Publish)**
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref }}`
            - **Build Run Number:** `#${{ github.run_number }}`
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
